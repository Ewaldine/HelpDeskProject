trigger:
  branches:
    include:
      - main
      - master

pool:
  name: 'Default'

variables:
  buildConfiguration: 'Release'
  solution: 'HelpDesk.sln'

stages:

  # ============================================================
  # BUILD AND TEST
  # ============================================================
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildAndTest
        displayName: 'Build, Test, Publish'
        steps:

          # Install .NET 8 SDK
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              packageType: 'sdk'
              version: '8.0.x'

          # Restore NuGet packages
          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet Packages'
            inputs:
              command: 'restore'
              projects: '**/*.csproj'

          # Build all projects
          - task: DotNetCoreCLI@2
            displayName: 'Build Solution'
            inputs:
              command: 'build'
              projects: '**/*.csproj'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          # Build test project separately
          - task: DotNetCoreCLI@2
            displayName: 'Build Test Project'
            inputs:
              command: 'build'
              projects: 'tests/HelpDesk.Tests/HelpDesk.Tests.csproj'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          # Run unit tests
          - task: DotNetCoreCLI@2
            displayName: 'Run Unit Tests'
            inputs:
              command: 'test'
              projects: 'tests/HelpDesk.Tests/HelpDesk.Tests.csproj'
              arguments: '--configuration $(buildConfiguration) --no-build --logger trx'
              publishTestResults: true
            continueOnError: true

          # Publish HelpDesk.API
          - task: DotNetCoreCLI@2
            displayName: 'Publish HelpDesk.API'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: 'src/HelpDesk.API/HelpDesk.API.csproj'
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/api --no-build'
              zipAfterPublish: true

          # Publish HelpDesk.Web
          - task: DotNetCoreCLI@2
            displayName: 'Publish HelpDesk.Web'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: 'src/HelpDesk.Web/HelpDesk.Web.csproj'
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/web --no-build'
              zipAfterPublish: true

          # Publish build artifacts
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Build Artifacts'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'
              publishLocation: 'Container'


  # ============================================================
  # DEPLOY TO AZURE
  # ============================================================
  - stage: Deploy
    displayName: 'Deploy to Azure'
    dependsOn: Build
    condition: succeeded()

    jobs:

      # ----------------------------------------------------------
      # DEPLOY API
      # ----------------------------------------------------------
      - deployment: DeployAPI
        displayName: 'Deploy HelpDesk.API'
        environment: 'production'

        pool:
          name: 'Default'

        strategy:
          runOnce:
            deploy:
              steps:

                - task: AzureWebApp@1
                  displayName: 'Deploy API to Azure App Service'
                  inputs:
                    azureSubscription: 'HelpDesk-Azure-Connection'
                    appType: 'webAppLinux'
                    appName: 'helpdesk-api-yourname'
                    package: '$(Pipeline.Workspace)/drop/api/*.zip'


      # ----------------------------------------------------------
      # DEPLOY WEB
      # ----------------------------------------------------------
      - deployment: DeployWeb
        displayName: 'Deploy HelpDesk.Web'
        environment: 'production'

        pool:
          name: 'Default'

        strategy:
          runOnce:
            deploy:
              steps:

                - task: AzureWebApp@1
                  displayName: 'Deploy Web to Azure App Service'
                  inputs:
                    azureSubscription: 'HelpDesk-Azure-Connection'
                    appType: 'webAppLinux'
                    appName: 'helpdesk-web-yourname'
                    package: '$(Pipeline.Workspace)/drop/web/*.zip'
